name: Build UniXNU & HackiOS Merlinx

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Pilih target build'
        required: true
        default: 'firmware_only'
        type: choice
        options:
          - firmware_only
          - firmware_and_xnu
          - xnu_only

jobs:
  # JOB 1: Build UEFI Mu-Silicium + Pack p33 Boot Image
  build-uefi:
    if: ${{ github.event.inputs.build_target != 'xnu_only' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository (Untuk mengambil file dtb lokal)
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang lld llvm gcc-aarch64-linux-gnu \
            nasm iasl git curl wget uuid-dev bc device-tree-compiler \
            abootimg libfdt-dev gzip cpio

      - name: Clone UniXNU-merlinx & uefi-merlinx
        run: |
          git clone --recurse-submodules https://github.com/Dracen-W/UniXNU-merlinx.git
          git clone --recurse-submodules https://github.com/Dracen-W/uefi-merlinx.git

      - name: Setup EDK2 Python Tools (Stuart) & UniXNU Deps
        working-directory: ./uefi-merlinx
        run: |
          python -m pip install --upgrade pip
          if [ -f "pip-requirements.txt" ]; then
            pip install -r pip-requirements.txt
          else
            pip install edk2-pytool-library edk2-pytool-extensions
          fi
          if [ -f "../UniXNU-merlinx/requirements.txt" ]; then
            pip install -r ../UniXNU-merlinx/requirements.txt
          fi
          stuart_setup -c Platforms/Xiaomi/merlinxPkg/PlatformBuild.py || true
          stuart_update -c Platforms/Xiaomi/merlinxPkg/PlatformBuild.py || true

      - name: Build UEFI & Pack p33 Boot Image (boot.img)
        working-directory: ./UniXNU-merlinx
        run: |
          chmod +x ./unixnu

          # 1. Build Package (UniXNU.efi & DarwinBoot) + Firmware (SILICIUM_UEFI.fd)
          python ./unixnu build package firmware -D . --uefi ../uefi-merlinx --edk2 ../uefi-merlinx/Mu_Basecore

          # 2. Cari file DTB mentah dari repo merlinx-hackios-builder
          if [ -f "$GITHUB_WORKSPACE/dtb" ]; then
            RAW_DTB="$GITHUB_WORKSPACE/dtb"
          elif [ -d "$GITHUB_WORKSPACE/dtb" ]; then
            RAW_DTB=$(find "$GITHUB_WORKSPACE/dtb" -type f | head -n 1)
          else
            echo "Error: File atau folder 'dtb' tidak ditemukan di repository!"
            exit 1
          fi

          echo "Found Raw DTB: $RAW_DTB"

          # 3. Ekstrak FDT murni TANPA di-recompile dtc (agar node /__symbols__ untuk DTBO overlay tidak rusak!)
          python3 -c "import sys, struct; d = open(sys.argv[1], 'rb').read(); i = d.index(b'\xd0\x0d\xfe\xed'); s = struct.unpack_from('>I', d, i+4)[0]; print(f'FDT offset: {i}, size: {s}'); open(sys.argv[2], 'wb').write(d[i:i+s])" "$RAW_DTB" "$PWD/clean_merlinx.dtb"
          DTB_PATH="$PWD/clean_merlinx.dtb"

          # 4. Buat Dummy Ramdisk (cpio.gz) agar bootloader MediaTek (lk) tidak menolak ramdisk 0 byte
          mkdir -p dummy_rd
          echo "merlinx" > dummy_rd/init
          (cd dummy_rd && find . | cpio -o -H newc | gzip -9 > "$PWD/../dummy_ramdisk.cpio.gz")

          # 5. Jalankan unixnu bootimg standar dulu dengan dummy ramdisk
          python ./unixnu bootimg -D . --uefi ../uefi-merlinx --dtb "$DTB_PATH" --ramdisk "$PWD/dummy_ramdisk.cpio.gz" -o "$PWD/boot_raw.img"

          # 6. Inject os_version=12.0.0, os_patch_level=2022-09, dan cmdline asli MT6768 ke dalam boot.img!
          python3 - "$PWD/boot_raw.img" "$PWD/boot.img" << 'EOF'
          import sys, struct
          raw_img, out_img = sys.argv[1], sys.argv[2]
          data = bytearray(open(raw_img, 'rb').read())
          
          # Hitung os_version (12.0.0) & os_patch_level (2022-09) sesuai standar Android Boot Image Header
          # os_version: (A << 14) | (B << 7) | C -> (12 << 14) = 196608
          # os_patch_level: ((Y - 2000) << 4) | M -> ((22) << 4) | 9 = 361
          os_ver_patch = (196608 << 11) | 361
          struct.pack_into('<I', data, 44, os_ver_patch)
          
          # Set cmdline asli merlinx: "bootopt=64S3,32N2,64N2 buildvariant=user" (offset 64, max 512 bytes)
          cmdline = b"bootopt=64S3,32N2,64N2 buildvariant=user"
          data[64:64+512] = cmdline.ljust(512, b'\x00')
          
          open(out_img, 'wb').write(data)
          print("Successfully patched boot.img with os_version=12.0.0, os_patch_level=2022-09, and MTK 64-bit cmdline!")
          EOF

      - name: Kumpulkan Hasil Build (boot.img, boot.json, & SILICIUM_UEFI.fd)
        run: |
          mkdir -p output_artifacts
          cp UniXNU-merlinx/boot.img output_artifacts/ 2>/dev/null || true
          cp UniXNU-merlinx/boot.json output_artifacts/ 2>/dev/null || true
          find uefi-merlinx/Build/ -name "SILICIUM_UEFI.fd" -exec cp {} output_artifacts/ \;
          ls -lh output_artifacts/
          cat output_artifacts/boot.json || true

      - name: Upload Boot Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: merlinx-uefi-bootimg
          path: output_artifacts/*

  # JOB 2: (Opsional) Build HackiOS XNU Kernel di macOS ARM64 Runner
  build-xnu:
    if: ${{ github.event.inputs.build_target != 'firmware_only' }}
    runs-on: macos-14
    steps:
      - name: Clone HackiOS XNU Kernel
        run: |
          git clone --recurse-submodules https://github.com/oosexgang/hackios-xnu-kernel.git

      - name: Inspect repo, README & toolchain
        working-directory: ./hackios-xnu-kernel
        run: |
          echo "=== ls ==="
          ls -la
          echo "=== README ==="
          head -n 100 README* 2>/dev/null || echo "(tidak ada README)"
          echo "=== Xcode & SDK ==="
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-path || true
          xcrun --sdk macosx --show-sdk-path || true
          echo "=== Tools ==="
          which dtrace ctfconvert ctfmerge ctfdump || true

      - name: Install build tools (best effort)
        run: |
          brew install cmake ninja pkg-config || true

      - name: Shim nproc (macOS tidak punya nproc)
        run: |
          printf '#!/bin/sh\nsysctl -n hw.ncpu\n' | sudo tee /usr/local/bin/nproc >/dev/null
          sudo chmod +x /usr/local/bin/nproc
          nproc

      - name: Build XNU Kernel
        working-directory: ./hackios-xnu-kernel
        continue-on-error: true
        run: |
          set -o pipefail
          # Repo ini pakai Makefile: "make kernel" = xnu/apply.sh + xnu-deps/setup.sh + xnu-build.sh
          make kernel JOBS=$(sysctl -n hw.ncpu) 2>&1 | tee "$GITHUB_WORKSPACE/xnu-build.log"

      - name: Cari hasil kernel
        if: always()
        run: |
          find hackios-xnu-kernel -type f \
            \( -name "kernel*" -o -name "*.kc" -o -name "kernelcache*" -o -name "*.kext" \) \
            -not -path "*/.git/*" -not -name "*.c" -not -name "*.h" -not -name "*.s" \
            | tee xnu-found.txt || true
          echo "=== 50 baris terakhir log ==="
          tail -n 50 xnu-build.log 2>/dev/null || true

      - name: Upload XNU Kernel Artifact & Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hackios-xnu-kernel-bin
          path: |
            xnu-build.log
            xnu-found.txt
            hackios-xnu-kernel/xnu-src/BUILD/obj/**/kernel*
            hackios-xnu-kernel/xnu-src/BUILD/obj/**/*.dSYM/**
            hackios-xnu-kernel/BUILD/**
            hackios-xnu-kernel/build/**
          if-no-files-found: warn
